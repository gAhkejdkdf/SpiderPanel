<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PANAHANNET Panel Login</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--pn-blue:#2B7FFF;--pn-purple:#7B61FF;--pn-red:#FF2352;--pn-cyan:#06B6D4;--pn-green:#10B981;--text-primary:#F8FAFC;--text-secondary:#94A3B8;--bg-dark:#0B1121;--surface-glass:rgba(15,23,42,.65);--border-glass:rgba(255,255,255,.07)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"Vazirmatn","Inter",sans-serif;background:var(--bg-dark);display:flex;align-items:center;justify-content:center}
.bg-scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(43,127,255,.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 80% 20%,rgba(123,97,255,.1) 0%,transparent 50%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(6,182,212,.08) 0%,transparent 50%)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(43,127,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,127,255,.05) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(100px);animation:orbFloat 14s ease-in-out infinite}
.orb-1{width:420px;height:420px;background:var(--pn-blue);top:-180px;left:-80px;opacity:.15}
.orb-2{width:360px;height:360px;background:var(--pn-purple);bottom:-140px;right:-100px;opacity:.12;animation-delay:-7s}
.orb-3{width:280px;height:280px;background:var(--pn-cyan);top:50%;left:60%;opacity:.07;animation-delay:-3s}
.orb-4{width:200px;height:200px;background:var(--pn-red);top:20%;right:20%;opacity:.05;animation-delay:-10s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-40px) scale(1.08)}50%{transform:translate(-20px,30px) scale(.92)}75%{transform:translate(15px,20px) scale(1.04)}}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;border-radius:50%;animation:particleDrift linear infinite;opacity:0}
@keyframes particleDrift{0%{transform:translateY(0) translateX(0) scale(1);opacity:0}8%{opacity:.8}85%{opacity:.8}100%{transform:translateY(-110vh) translateX(40px) scale(.4);opacity:0}}
.scanline{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(43,127,255,.015) 50%);background-size:100% 4px;pointer-events:none;z-index:1}
.scanline::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0%,rgba(43,127,255,.04) 50%,transparent 100%);animation:scanMove 6s linear infinite}
@keyframes scanMove{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:20px}
.card{position:relative;background:var(--surface-glass);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);border:1px solid var(--border-glass);border-radius:28px;padding:48px 36px 40px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 20px 60px rgba(0,0,0,.5),0 0 120px rgba(43,127,255,.08);overflow:hidden;transition:transform .4s cubic-bezier(.22,.68,0,.98),box-shadow .4s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.6),0 0 160px rgba(43,127,255,.15)}
.card::before{content:"";position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--pn-blue),var(--pn-purple),transparent);border-radius:50%}
.card::after{content:"";position:absolute;bottom:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(123,97,255,.12),transparent 70%);pointer-events:none;border-radius:50%}
.glow-ring{position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(135deg,rgba(43,127,255,.3),rgba(123,97,255,.2),rgba(6,182,212,.15),transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:xor;-webkit-mask-composite:xor;opacity:.5;transition:opacity .4s;z-index:-1}
.card:focus-within .glow-ring{opacity:1}
.logo-area{display:flex;align-items:center;justify-content:center;margin-bottom:28px;position:relative;z-index:1}
.logo-img{width:88px;height:88px;border-radius:24px;filter:drop-shadow(0 8px 24px rgba(43,127,255,.4));transition:transform .5s cubic-bezier(.22,.68,0,.98),filter .5s ease}
.card:hover .logo-img{transform:scale(1.06) rotate(2deg);filter:drop-shadow(0 12px 32px rgba(43,127,255,.55))}
.logo-glow{position:absolute;width:120px;height:120px;background:radial-gradient(circle,rgba(43,127,255,.2),transparent 70%);border-radius:50%;animation:pulse 3s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:.3}}
.title-area{text-align:center;margin-bottom:28px;position:relative;z-index:1}
.brand-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,#60A5FA,#A78BFA,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
.brand-tag{font-size:12px;color:var(--text-secondary);margin-top:6px;font-weight:500;letter-spacing:.04em}
.field-group{position:relative;margin-bottom:18px;z-index:1}
.field-label{font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.04em;text-transform:uppercase}
.input-wrap{position:relative}
.field-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:20px;transition:color .3s;z-index:2}
.field-input{width:100%;height:56px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:0 50px 0 16px;font-family:"Vazirmatn",sans-serif;font-size:15px;color:var(--text-primary);outline:none;transition:all .3s ease}
.field-input::placeholder{color:rgba(148,163,184,.4)}
.field-input:focus{border-color:rgba(43,127,255,.5);background:rgba(43,127,255,.06);box-shadow:0 0 0 4px rgba(43,127,255,.1)}
.field-input:focus ~ .field-icon{color:var(--pn-blue)}
.eye-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:20px;padding:4px;border-radius:8px;transition:all .2s}
.eye-btn:hover{color:var(--pn-purple);background:rgba(123,97,255,.1)}
.error-msg{display:none;align-items:center;gap:10px;background:rgba(255,35,82,.08);border:1px solid rgba(255,35,82,.2);border-radius:14px;padding:12px 16px;margin-bottom:18px;color:#FCA5A5;font-size:13px;position:relative;z-index:1;animation:shake .4s ease}
.error-msg.show{display:flex}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.hint-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(43,127,255,.06);border:1px solid rgba(43,127,255,.15);border-radius:14px;padding:12px 16px;margin-bottom:22px;position:relative;z-index:1}
.hint-label{font-size:11px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px}
.hint-value{font-family:"Inter",monospace;font-size:14px;font-weight:700;color:var(--pn-blue);background:rgba(43,127,255,.12);border:1px solid rgba(43,127,255,.25);padding:4px 14px;border-radius:10px;cursor:pointer;transition:all .25s ease;letter-spacing:.06em;direction:ltr}
.hint-value:hover{background:rgba(43,127,255,.2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(43,127,255,.2)}
.submit-btn{width:100%;height:62px;border:none;border-radius:18px;cursor:pointer;position:relative;z-index:1;font-family:"Vazirmatn",sans-serif;font-size:16px;font-weight:700;color:#fff;overflow:hidden;transition:all .35s cubic-bezier(.22,.68,0,.98);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.submit-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--pn-blue),var(--pn-purple),var(--pn-cyan),var(--pn-purple),var(--pn-blue));background-size:300% 100%;animation:gradShift 4s linear infinite;opacity:1}
.submit-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--pn-cyan),var(--pn-purple),var(--pn-blue),var(--pn-purple),var(--pn-cyan));background-size:300% 100%;opacity:0;transition:opacity .35s}
.submit-btn:hover::after{opacity:1}
.submit-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(43,127,255,.35),0 4px 16px rgba(123,97,255,.2)}
.submit-btn:active{transform:translateY(0) scale(.97)}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.submit-btn span{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
@keyframes gradShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-loading .spinner{display:inline-block}
.btn-loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;position:relative;z-index:1;font-size:11px;color:var(--text-secondary)}
.footer .dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,var(--pn-blue),var(--pn-purple));display:inline-block;margin:0 8px;box-shadow:0 0 8px rgba(43,127,255,.4)}
.footer a{color:var(--pn-blue);text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--pn-purple)}
.version-badge{position:fixed;top:20px;left:20px;z-index:20;background:rgba(15,23,42,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:6px 14px;font-size:10px;color:var(--text-secondary);font-family:"Inter",monospace;direction:ltr;letter-spacing:.05em}
.theme-toggle{position:fixed;top:20px;right:20px;z-index:20;width:42px;height:42px;border-radius:14px;background:rgba(15,23,42,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);color:var(--text-secondary);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}
.theme-toggle:hover{background:rgba(43,127,255,.15);color:var(--pn-blue);border-color:rgba(43,127,255,.2)}
.success-overlay{position:fixed;inset:0;z-index:100;background:rgba(11,17,33,.92);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.success-overlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.success-check{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--pn-green),#34D399);display:flex;align-items:center;justify-content:center;font-size:40px;animation:popIn .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{0%{transform:scale(0) rotate(-45deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.success-text{font-size:22px;font-weight:700;color:var(--text-primary)}
@media(max-width:480px){.wrap{padding:16px}.card{padding:36px 24px 32px;border-radius:22px}.brand-name{font-size:24px}.logo-img{width:72px;height:72px;border-radius:20px}.submit-btn{height:56px;font-size:15px}}
</style>
</head>
<body>
<div class="bg-scene">
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>
  <div class="scanline"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
  <div class="particles" id="particles"></div>
</div>
<button class="theme-toggle" id="themeBtn"><i class="ti ti-sun" id="themeIcon"></i></button>
<div class="version-badge" id="versionBadge">v9.5.50</div>
<div class="wrap">
  <div class="card" id="loginCard">
    <div class="glow-ring"></div>
    <div class="logo-area">
      <div class="logo-glow"></div>
      <img class="logo-img" src="/static/panahannet-logo.svg" alt="PANAHANNET" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%22 stop-color=%22%232563eb%22/><stop offset=%221%22 stop-color=%22%237c3aed%22/></linearGradient></defs><rect x=%226%22 y=%226%22 width=%22116%22 height=%22116%22 rx=%2230%22 fill=%22url(%23g)%22/><path d=%22M42 88V40h18c11.6 0 19 6 19 16.4S71.6 73 60 73h-6v15h-12z%22 fill=%22%23fff%22/></svg>'">
    </div>
    <div class="title-area">
      <div class="brand-name" id="brandName">PANAHANNET</div>
      <div class="brand-tag" id="brandTag">Gateway Security System</div>
    </div>
    <div class="error-msg" id="errMsg"><i class="ti ti-alert-circle" style="font-size:20px;flex-shrink:0"></i><span id="errText"></span></div>
    <div class="hint-bar">
      <span class="hint-label"><i class="ti ti-key" style="font-size:14px"></i> رمز پیشفرض مدیریت</span>
      <span class="hint-value" onclick="fillPassword(this,'123456')">123456</span>
    </div>
    <form id="loginForm">
      <div class="field-group">
        <div class="field-label"><i class="ti ti-lock"></i> رمز عبور</div>
        <div class="input-wrap">
          <input class="field-input" id="pwInput" type="password" placeholder="رمز عبور را وارد کنید..." autofocus required autocomplete="current-password">
          <span class="field-icon ti ti-lock"></span>
          <button type="button" class="eye-btn" id="eyeBtn" title="نمایش رمز"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-text"><i class="ti ti-login"></i> ورود به داشبورد</span>
      </button>
    </form>
    <div class="footer">
      <span class="dot"></span>
      <span id="footerBrand">PANAHANNET Panel</span>
      <span class="dot"></span>
      <a href="#" id="footerLink">پشتیبانی تلگرام</a>
    </div>
  </div>
</div>
<div class="success-overlay" id="successOverlay">
  <div class="success-check"><i class="ti ti-check"></i></div>
  <div class="success-text">ورود موفق!</div>
  <div style="font-size:13px;color:var(--text-secondary)">در حال انتقال به داشبورد...</div>
</div>
<script>
(function(){
  try{
    var b=window.__BRAND__||{};
    if(b.panel_name)document.getElementById('brandName').textContent=b.panel_name;
    if(b.footer_text)document.getElementById('footerBrand').textContent=b.footer_text;
    if(b.support_url)document.getElementById('footerLink').href=b.support_url;
    if(b.panel_version)document.getElementById('versionBadge').textContent='v'+b.panel_version;
  }catch(e){}
  var saved=localStorage.getItem('pn-theme')||'dark';
  document.documentElement.setAttribute('data-theme',saved);
  function updateThemeIcon(dark){var ic=document.getElementById('themeIcon');ic.className='ti ti-'+(dark?'ti-moon':'ti-sun');}
  updateThemeIcon(saved==='dark');
  document.getElementById('themeBtn').onclick=function(){
    var isDark=document.documentElement.getAttribute('data-theme')==='dark';
    var next=isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('pn-theme',next);
    updateThemeIcon(next);
  };
  var pc=document.getElementById('particles');
  var colors=['#2B7FFF','#7B61FF','#06B6D4','#10B981','#FF2352'];
  for(var i=0;i<25;i++){
    var p=document.createElement('div');
    p.className='particle';
    var size=2+Math.random()*4;
    p.style.cssText='width:'+size+'px;height:'+size+'px;background:'+colors[i%colors.length]+';left:'+Math.random()*100+'%;top:'+100+Math.random()*20+'%;animation-duration:'+(10+Math.random()*18)+'s;animation-delay:'+-Math.random()*20+'s;';
    pc.appendChild(p);
  }
  // Fetch CSRF token on page load
  (async function(){ try{ var r=await fetch('/api/csrf-token'); if(r.ok){var d=await r.json();var h=document.getElementById('csrf-hidden');if(h)h.value=d.csrf_token;} }catch(e){} })();
  var pw=document.getElementById('pwInput'),eye=document.getElementById('eyeBtn'),eyeIcon=eye.querySelector('i');
  eye.onclick=function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eyeIcon.className='ti ti-'+(show?'ti-eye-off':'ti-eye');
  };
  window.fillPassword=function(el,val){
    pw.value=val;pw.focus();
    el.style.background='rgba(16,185,129,.15)';el.style.borderColor='rgba(16,185,129,.3)';
    setTimeout(function(){el.style.background='';el.style.borderColor=''},1500);
  };
  document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();
    var btn=document.getElementById('submitBtn'),err=document.getElementById('errMsg'),et=document.getElementById('errText');
    err.classList.remove('show');
    btn.disabled=true;btn.classList.add('btn-loading');
    try{
      var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});
      if(!r.ok){var d=await r.json().catch(function(){return{}});throw new Error(d.detail||'خطا در ورود');}
      document.getElementById('successOverlay').classList.add('show');
      setTimeout(function(){location.href=window.__PANEL_PATH__||'/panel';},800);
    }catch(ex){
      et.textContent=ex.message;err.classList.add('show');
      btn.disabled=false;btn.classList.remove('btn-loading');
    }
  });
  var card=document.getElementById('loginCard');
  document.addEventListener('mousemove',function(e){
    if(window.innerWidth<768)return;
    var rect=card.getBoundingClientRect();
    var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    var dx=(e.clientX-cx)/rect.width*.03;
    var dy=(e.clientY-cy)/rect.height*.03;
    card.style.transform='perspective(800px) rotateY('+dx+'rad) rotateX('+(-dy)+'rad)';
  });
  document.addEventListener('mouseleave',function(){card.style.transform='';});
})();
</script>
</body>
</html>
