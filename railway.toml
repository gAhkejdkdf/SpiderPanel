[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# The image CMD already binds to ${PORT:-8080}; no startCommand override so the
# value Railway injects is honored (a hardcoded port breaks the deploy).
healthcheckPath = "/"
healthcheckTimeout = 120
